<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070904" />
  <meta name="description" content="Un detalle lleno de flores amarillas para mi angelita hermosa." />
  <title>Para mi angelita hermosa</title>
  <style>
    :root {
      --sky-top: #101608;
      --sky-bottom: #020302;
      --sunflower: #ffc928;
      --sunflower-dark: #ed9d00;
      --rose: #ffd62e;
      --rose-light: #fff48a;
      --rose-shadow: #e5a900;
      --green: #3f8d38;
      --green-dark: #24622d;
      --brown: #70401e;
      --ink: #ffe676;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      display: grid;
      place-items: center;
      min-height: 100svh;
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 50% 58%, rgba(105,126,28,.18), transparent 44%),
        radial-gradient(circle at 15% 18%, rgba(255,225,72,.8) 0 1px, transparent 3px),
        radial-gradient(circle at 84% 24%, rgba(255,240,135,.65) 0 2px, transparent 4px),
        linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .32;
      background-image: radial-gradient(#ffda3c 0.8px, transparent 1px);
      background-size: 35px 35px;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 8% 14%, rgba(255,214,46,.1) 0 38px, transparent 39px),
        radial-gradient(circle at 92% 17%, rgba(255,223,79,.08) 0 54px, transparent 55px),
        radial-gradient(circle at 82% 83%, rgba(111,144,35,.12) 0 70px, transparent 71px);
    }

    .card {
      position: relative;
      width: min(92vw, 760px);
      min-height: min(90svh, 720px);
      padding: clamp(24px, 5vw, 48px) clamp(18px, 5vw, 48px) 24px;
      overflow: hidden;
      text-align: center;
      border: 1px solid rgba(255,222,91,.18);
      border-radius: 34px;
      background: linear-gradient(180deg, rgba(11,16,7,.8), rgba(2,4,2,.94));
      box-shadow: 0 30px 90px rgba(0,0,0,.72), inset 0 1px 0 rgba(255,232,134,.12);
      backdrop-filter: blur(12px);
      animation: appear 1s cubic-bezier(.2,.9,.2,1) both;
    }

    .date {
      margin: 0 0 8px;
      font-size: clamp(.72rem, 2vw, .9rem);
      font-weight: 800;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: #a36a00;
    }

    h1 {
      position: relative;
      z-index: 4;
      max-width: 630px;
      margin: 0 auto;
      font-family: "Segoe Script", "Brush Script MT", Georgia, serif;
      font-size: clamp(2rem, 6.8vw, 4.1rem);
      line-height: .98;
      letter-spacing: -.04em;
      text-wrap: balance;
      color: #ffe03b;
      text-shadow: 0 0 12px rgba(255,207,0,.3), 0 3px 12px #000;
    }

    .subtitle {
      position: relative;
      z-index: 4;
      margin: 13px auto 0;
      max-width: 470px;
      font-size: clamp(.9rem, 2.7vw, 1.08rem);
      line-height: 1.5;
      color: #f8eab0;
    }

    .background-decor {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .decor {
      position: absolute;
      color: rgba(218, 145, 0, .42);
      text-shadow: 0 2px 8px rgba(255,255,255,.75);
      animation: twinkle 3s ease-in-out infinite alternate;
    }

    .decor:nth-child(1) { left: 5%; top: 17%; font-size: 1.7rem; animation-delay: -.5s; }
    .decor:nth-child(2) { right: 6%; top: 13%; font-size: 2rem; animation-delay: -1.4s; }
    .decor:nth-child(3) { left: 8%; top: 43%; font-size: 1.2rem; animation-delay: -2.1s; }
    .decor:nth-child(4) { right: 8%; top: 39%; font-size: 1.45rem; animation-delay: -.9s; }
    .decor:nth-child(5) { left: 41%; top: 32%; font-size: 1rem; animation-delay: -1.8s; }
    .decor:nth-child(6) { right: 24%; top: 28%; font-size: 1rem; animation-delay: -.2s; }

    .garden {
      position: absolute;
      inset: auto 0 0;
      height: 58%;
    }

    .ground {
      position: absolute;
      inset: auto -10% -17% -10%;
      height: 42%;
      border-radius: 50% 50% 0 0;
      background: radial-gradient(ellipse at 50% 0, rgba(73,112,36,.55), transparent 64%), linear-gradient(180deg, rgba(20,49,19,.72), #020602);
      box-shadow: inset 0 10px 30px rgba(119,164,58,.12);
      z-index: 1;
    }

    .bouquet-paper {
      position: absolute;
      z-index: 2;
      left: 50%;
      bottom: 2%;
      width: 50%;
      height: 55%;
      transform: translateX(-50%);
      clip-path: polygon(4% 0, 96% 0, 71% 100%, 29% 100%);
      background: linear-gradient(100deg, rgba(255,145,177,.48), rgba(255,221,185,.7) 48%, rgba(187,71,124,.42)), repeating-linear-gradient(115deg, transparent 0 18px, rgba(255,255,255,.16) 19px 20px);
      border-top: 2px solid rgba(255,231,210,.65);
      filter: drop-shadow(0 12px 14px rgba(0,0,0,.5));
      opacity: 0;
      animation: unwrap 1.4s 10.4s ease forwards;
    }

    .bouquet-paper::after {
      content: "";
      position: absolute;
      left: 22%; right: 22%; bottom: 15%; height: 13px;
      border-radius: 50%;
      background: linear-gradient(#f7c345, #a86700);
      box-shadow: 0 4px 10px rgba(0,0,0,.35);
    }

    .flower {
      position: absolute;
      bottom: 13%;
      transform-origin: 50% 100%;
      animation: sway 3.8s ease-in-out infinite alternate;
      z-index: 3;
    }

    .sunflower { left: 11%; width: clamp(155px, 31vw, 245px); height: 88%; }
    .rose { right: 10%; width: clamp(130px, 27vw, 205px); height: 76%; animation-delay: -.9s; }

    .stem {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 13px;
      height: 65%;
      transform: translateX(-50%);
      border-radius: 10px;
      background: linear-gradient(90deg, #102e16, #66994a 48%, #183c1b 78%, #081d0d);
      box-shadow: 3px 0 4px rgba(45,85,31,.2);
      transform-origin: 50% 100%;
      animation: grow-stem 1.8s .35s cubic-bezier(.2,.8,.2,1) both;
    }

    .leaf {
      position: absolute;
      width: 64px;
      height: 31px;
      border-radius: 90% 5% 90% 5%;
      background: linear-gradient(135deg, #719d4e, #234f27 55%, #0b2816);
      box-shadow: inset 0 2px 5px rgba(255,255,255,.18), 0 4px 6px rgba(0,0,0,.35);
      opacity: 0;
      scale: 0;
      animation: grow-leaf .9s 1.55s cubic-bezier(.2,1.4,.3,1) forwards;
    }

    .leaf::after {
      content: "";
      position: absolute;
      width: 80%;
      height: 2px;
      left: 8%;
      top: 52%;
      background: rgba(25,91,38,.45);
      transform: rotate(16deg);
    }

    .leaf.left { left: 49%; bottom: 24%; transform: translateX(-100%) rotate(12deg); }
    .leaf.right { left: 52%; bottom: 39%; transform: rotate(76deg) scale(.88); animation-delay: 1.95s; }

    .rose .stem { animation-delay: 5.2s; }
    .rose .leaf.left { animation-delay: 6.55s; }
    .rose .leaf.right { animation-delay: 6.95s; }

    .sunflower-head {
      position: absolute;
      left: 50%;
      top: 1%;
      width: 76%;
      aspect-ratio: 1;
      transform: translateX(-50%);
      opacity: 0;
      scale: .15;
      filter: drop-shadow(0 10px 12px rgba(0,0,0,.5));
      animation: assemble-head .9s 2.25s cubic-bezier(.2,1.25,.3,1) forwards, sunflower-breathe 4.5s 4.75s ease-in-out infinite alternate;
    }

    .petal {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 34%;
      height: 15%;
      margin-left: -17%;
      margin-top: -7.5%;
      border-radius: 100% 15% 100% 15%;
      background: linear-gradient(90deg, #b76c00, #ffbd08 32%, #ffe34f 68%, #fff19a);
      box-shadow: inset 0 -4px 6px rgba(147,79,0,.3), inset 0 2px 3px rgba(255,255,255,.35), 0 3px 5px rgba(0,0,0,.22);
      transform: rotate(calc(var(--i) * 22.5deg)) translateX(88%);
      opacity: 0;
      scale: 0;
      animation: build-petal .7s var(--delay) cubic-bezier(.2,1.4,.3,1) forwards;
    }

    .petal.inner {
      width: 30%;
      height: 11%;
      margin-left: -15%;
      margin-top: -5.5%;
      transform: rotate(calc(var(--i) * 22.5deg + 11.25deg)) translateX(72%);
      filter: brightness(.88);
    }

    .center {
      position: absolute;
      z-index: 2;
      inset: 28%;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background:
        radial-gradient(circle, #c18424 0 1.5px, transparent 2px) 0 0 / 6px 6px,
        radial-gradient(circle at 38% 35%, #644018, #211107 68%, #080402);
      border: 4px solid #9b641b;
      box-shadow: 0 5px 14px rgba(0,0,0,.65), inset 0 0 16px #090300;
    }

    .flower-message {
      position: absolute;
      z-index: 6;
      left: 50%;
      top: 50%;
      width: 37%;
      display: grid;
      place-items: center;
      transform: translate(-50%, -50%);
      font-size: clamp(.39rem, 1.25vw, .68rem);
      font-weight: 900;
      line-height: 1.08;
      text-wrap: balance;
      color: #fff8cf;
      text-shadow: 0 1px 2px #3e210e;
      opacity: 0;
      animation: show-message .8s 4.65s ease forwards;
    }

    .rose-head {
      position: absolute;
      left: 50%;
      top: 4%;
      width: 76%;
      aspect-ratio: 1;
      transform: translateX(-50%);
      filter: drop-shadow(0 7px 5px rgba(139,86,0,.2));
      opacity: 0;
      scale: .15;
      animation: assemble-head 1s 7.45s cubic-bezier(.2,1.25,.3,1) forwards, bloom 4s 11.2s ease-in-out infinite alternate;
    }

    .rose-petal {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 52%;
      height: 50%;
      margin: -25% 0 0 -26%;
      border-radius: 55% 55% 45% 45%;
      transform-origin: 50% 85%;
      background: radial-gradient(ellipse at 45% 15%, #fff6a3, #ffd51f 42%, #dc8d00 76%, #8f5100);
      border: 1px solid rgba(218,154,0,.25);
      opacity: 0;
      scale: 0;
      animation: build-petal .85s var(--delay) cubic-bezier(.2,1.4,.3,1) forwards;
    }

    .rose-petal:nth-child(1) { transform: rotate(0deg) translateY(-48%) scale(.94); }
    .rose-petal:nth-child(2) { transform: rotate(45deg) translateY(-48%) scale(.94); }
    .rose-petal:nth-child(3) { transform: rotate(90deg) translateY(-48%) scale(.94); }
    .rose-petal:nth-child(4) { transform: rotate(135deg) translateY(-48%) scale(.94); }
    .rose-petal:nth-child(5) { transform: rotate(180deg) translateY(-48%) scale(.94); }
    .rose-petal:nth-child(6) { transform: rotate(225deg) translateY(-48%) scale(.94); }
    .rose-petal:nth-child(7) { transform: rotate(270deg) translateY(-48%) scale(.94); }
    .rose-petal:nth-child(8) { transform: rotate(315deg) translateY(-48%) scale(.94); }
    .rose-petal:nth-child(9) { transform: rotate(22deg) translateY(-20%) scale(.7); }
    .rose-petal:nth-child(10) { transform: rotate(112deg) translateY(-20%) scale(.7); }
    .rose-petal:nth-child(11) { transform: rotate(202deg) translateY(-20%) scale(.7); }
    .rose-petal:nth-child(12) { transform: rotate(292deg) translateY(-20%) scale(.7); }

    .rose .flower-message {
      width: 44%;
      min-height: 44%;
      padding: 7% 4%;
      border-radius: 50%;
      color: #664014;
      background: rgba(255, 242, 118, .88);
      text-shadow: 0 1px 0 #fff;
      box-shadow: 0 2px 8px rgba(125,76,0,.2);
      animation-delay: 11.15s;
    }

    .heart {
      position: absolute;
      z-index: 5;
      bottom: -30px;
      font-size: clamp(15px, 3vw, 24px);
      color: #ef9f00;
      opacity: 0;
      animation: float-up var(--speed) ease-in infinite;
      animation-delay: var(--delay);
      filter: drop-shadow(0 2px 2px rgba(255,255,255,.8));
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(24px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes sway {
      from { transform: rotate(-2.5deg); }
      to { transform: rotate(2.5deg); }
    }

    @keyframes grow-stem {
      from { transform: translateX(-50%) scaleY(0); }
      to { transform: translateX(-50%) scaleY(1); }
    }

    @keyframes grow-leaf {
      from { opacity: 0; scale: 0; }
      to { opacity: 1; scale: 1; }
    }

    @keyframes assemble-head {
      from { opacity: 0; scale: .15; }
      to { opacity: 1; scale: 1; }
    }

    @keyframes build-petal {
      from { opacity: 0; scale: 0; }
      to { opacity: 1; scale: 1; }
    }

    @keyframes show-message {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes twinkle {
      from { opacity: .35; transform: translateY(0) rotate(-8deg) scale(.9); }
      to { opacity: .9; transform: translateY(-8px) rotate(8deg) scale(1.12); }
    }

    @keyframes sunflower-breathe {
      from { transform: translateX(-50%) rotate(-1.5deg) scale(.98); }
      to { transform: translateX(-50%) rotate(1.5deg) scale(1.02); }
    }

    @keyframes unwrap {
      from { opacity: 0; transform: translateX(-50%) translateY(35px) scale(.85); }
      to { opacity: .92; transform: translateX(-50%) translateY(0) scale(1); }
    }

    @keyframes spin {
      to { transform: translateX(-50%) rotate(360deg); }
    }

    @keyframes bloom {
      from { transform: translateX(-50%) scale(.95) rotate(-2deg); }
      to { transform: translateX(-50%) scale(1.04) rotate(2deg); }
    }

    @keyframes float-up {
      0% { transform: translateY(0) rotate(0); opacity: 0; }
      14% { opacity: .78; }
      100% { transform: translateY(-72svh) rotate(25deg); opacity: 0; }
    }

    @media (max-height: 650px) {
      .card { min-height: 94svh; padding-top: 18px; }
      .garden { height: 56%; }
      .subtitle { margin-top: 7px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="card" aria-label="Dedicatoria con una rosa amarilla y un girasol">
    <h1>Mi angelita hermosa,<br />te amo mucho</h1>
    <p class="subtitle">Eres lo mejor que me pasó en esta vida. 💛</p>

    <div class="background-decor" aria-hidden="true">
      <span class="decor">✦</span><span class="decor">♥</span>
      <span class="decor">🌼</span><span class="decor">✦</span>
      <span class="decor">♥</span><span class="decor">✧</span>
    </div>

    <section class="garden" aria-hidden="true">
      <div class="ground"></div>
      <div class="bouquet-paper"></div>

      <div class="flower sunflower">
        <div class="stem"></div>
        <div class="leaf left"></div>
        <div class="leaf right"></div>
        <div class="sunflower-head">
          <span class="petal" style="--i:0;--delay:2.35s"></span><span class="petal" style="--i:1;--delay:2.47s"></span>
          <span class="petal" style="--i:2;--delay:2.59s"></span><span class="petal" style="--i:3;--delay:2.71s"></span>
          <span class="petal" style="--i:4;--delay:2.83s"></span><span class="petal" style="--i:5;--delay:2.95s"></span>
          <span class="petal" style="--i:6;--delay:3.07s"></span><span class="petal" style="--i:7;--delay:3.19s"></span>
          <span class="petal" style="--i:8;--delay:3.31s"></span><span class="petal" style="--i:9;--delay:3.43s"></span>
          <span class="petal" style="--i:10;--delay:3.55s"></span><span class="petal" style="--i:11;--delay:3.67s"></span>
          <span class="petal" style="--i:12;--delay:3.79s"></span><span class="petal" style="--i:13;--delay:3.91s"></span>
          <span class="petal" style="--i:14;--delay:4.03s"></span><span class="petal" style="--i:15;--delay:4.15s"></span>
          <span class="petal inner" style="--i:0;--delay:2.42s"></span><span class="petal inner" style="--i:1;--delay:2.54s"></span>
          <span class="petal inner" style="--i:2;--delay:2.66s"></span><span class="petal inner" style="--i:3;--delay:2.78s"></span>
          <span class="petal inner" style="--i:4;--delay:2.9s"></span><span class="petal inner" style="--i:5;--delay:3.02s"></span>
          <span class="petal inner" style="--i:6;--delay:3.14s"></span><span class="petal inner" style="--i:7;--delay:3.26s"></span>
          <span class="petal inner" style="--i:8;--delay:3.38s"></span><span class="petal inner" style="--i:9;--delay:3.5s"></span>
          <span class="petal inner" style="--i:10;--delay:3.62s"></span><span class="petal inner" style="--i:11;--delay:3.74s"></span>
          <span class="petal inner" style="--i:12;--delay:3.86s"></span><span class="petal inner" style="--i:13;--delay:3.98s"></span>
          <span class="petal inner" style="--i:14;--delay:4.1s"></span><span class="petal inner" style="--i:15;--delay:4.22s"></span>
          <span class="center"></span>
          <span class="flower-message">Eres mi vida entera</span>
        </div>
      </div>

      <div class="flower rose">
        <div class="stem"></div>
        <div class="leaf left"></div>
        <div class="leaf right"></div>
        <div class="rose-head">
          <span class="rose-petal" style="--delay:7.55s"></span><span class="rose-petal" style="--delay:7.78s"></span>
          <span class="rose-petal" style="--delay:8.01s"></span><span class="rose-petal" style="--delay:8.24s"></span>
          <span class="rose-petal" style="--delay:8.47s"></span><span class="rose-petal" style="--delay:8.7s"></span>
          <span class="rose-petal" style="--delay:8.93s"></span><span class="rose-petal" style="--delay:9.16s"></span>
          <span class="rose-petal" style="--delay:9.39s"></span><span class="rose-petal" style="--delay:9.62s"></span>
          <span class="rose-petal" style="--delay:9.85s"></span><span class="rose-petal" style="--delay:10.08s"></span>
          <span class="flower-message">Una hermosa flor para mi hermosa flor</span>
        </div>
      </div>
    </section>

    <span class="heart" style="left:9%;--speed:7s;--delay:-1s">♥</span>
    <span class="heart" style="left:28%;--speed:9s;--delay:-5s">♥</span>
    <span class="heart" style="left:53%;--speed:8s;--delay:-3s">♥</span>
    <span class="heart" style="left:74%;--speed:10s;--delay:-7s">♥</span>
    <span class="heart" style="left:91%;--speed:7.5s;--delay:-4s">♥</span>
  </main>
</body>
</html>
